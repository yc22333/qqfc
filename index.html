<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充值通道</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#1e3c72;overflow:hidden;font-family:sans-serif;-webkit-text-size-adjust:100%;}
  iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:block;}
  .loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;}
  .spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;margin-bottom:14px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{font-size:15px;letter-spacing:1px;margin:0;}
</style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在加载充值通道，请稍候…</p>
  </div>
  <iframe id="frame" src="http://171.80.15.148:8088/"
          allow="fullscreen"
          referrerpolicy="no-referrer"
          onload="hideLoading()"></iframe>
<script>
  function hideLoading(){
    var l=document.getElementById('loading');
    if(l) l.style.display='none';
  }
  // 兜底：超时也隐藏加载层，避免一直转圈挡住
  setTimeout(hideLoading, 4000);
</script>
</body>
</html>
